services:
  db:
    image: postgres:16-alpine
    container_name: devpractice-db
    environment:
      POSTGRES_USER: devpractice
      POSTGRES_PASSWORD: devpractice
      POSTGRES_DB: devpractice
    ports:
      - "5440:5432"
    volumes:
      - devpractice-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpractice"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  devpractice-pgdata:
