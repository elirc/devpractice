services:
  db:
    image: postgres:16-alpine
    container_name: m02-support-desk-db
    environment:
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: supportdesk
      POSTGRES_DB: supportdesk
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk"]
      interval: 5s
      timeout: 5s
      retries: 20
